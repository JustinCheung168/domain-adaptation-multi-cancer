---
# Evaluate Breast NK Reinhard model on Colon domain only
checkpoint_dir: results\dann_train_val_breast_nk_reinhard_results\parabolic_increasing_lambda_scheduler_fold_0_2025-12-22_00-55-31\final_model\model.safetensors
output_dir: results/dann_test_breast_nk_reinhard_colon_domain_results/
architecture:
    cls_name: ResNet50DANN
    cls_init_args:
        num_classes: 2  # Binary classification: benign (0) vs malignant (1)
        # Unused in evaluation.
        lamb_initial: 0.0
        ld_scale: 1.0
evaluation:
    evaluator:
        cls_name: DANNTrainer
    dataset:
        cls_name: TwoLabelDataset
        convert_grayscale_to_rgb: False
        fold_file_paths:
            - data/preprocessed/reinhard/breast_nk_reinhard_test_colon.npz
    evaluation_arguments:
        batch_size: 32
