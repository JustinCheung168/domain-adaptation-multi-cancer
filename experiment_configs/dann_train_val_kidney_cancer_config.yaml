---
output_dir: results/dann_train_val_kidney_cancer_results/
architecture:
    cls_name: ResNet50DANN
    cls_init_args:
        num_classes: 2  # Binary classification: benign (0) vs malignant (1)
        lamb_initial: 0.0
        ld_scale: 1.0
training:
    trainer:
        cls_name: DANNTrainer
    dataset:
        cls_name: TwoLabelDataset
        convert_grayscale_to_rgb: False
        fold_file_paths:
            - data/preprocessed/kidney_cancer_train.npz
            - data/preprocessed/kidney_cancer_val.npz
        # For each fold, specify which files to include in training vs. validation as indices of the `fold_file_paths` list.
        folds:
            -
                train:
                    - 0
                val:
                    - 1
    training_arguments:
        num_train_epochs: 50
        batch_size: 32
        learning_rate: 0.1
        weight_decay: 0.0001
        optim: sgd
        resume_from_checkpoint: False
    lambda_scheduler: parabolic_increasing_lambda_scheduler
